<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伤害计算器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .input-group input::-webkit-outer-spin-button,
        .input-group input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-group input[type=number] { -moz-appearance: textfield; }
        .unit { color: #888; font-size: 14px; margin-left: 8px; }
        .btn-calculate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            display: none;
        }
        .result.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .result-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
        .result-value { font-size: 32px; font-weight: 700; margin-bottom: 15px; }
        .result-detail { font-size: 14px; opacity: 0.9; line-height: 1.6; }
        .result-advice {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ 伤害计算器</h1>
        
        <div class="input-group">
            <label>每击伤害（战力）</label>
            <input type="number" id="attackPower" placeholder="请输入战力值" step="0.1" min="0">
        </div>
        
        <div class="input-group">
            <label>暴击率 <span class="unit">%</span></label>
            <input type="number" id="critRate" placeholder="请输入暴击率" step="0.1" min="0" max="100">
        </div>
        
        <div class="input-group">
            <label>怪物血量 <span class="unit">万</span></label>
            <input type="number" id="monsterHp" placeholder="请输入怪物血量" step="0.1" min="0">
        </div>
        
        <div class="input-group">
            <label>伤害加成 <span class="unit">%</span></label>
            <input type="number" id="damageBonus" placeholder="请输入伤害加成" step="0.1" min="0" value="0">
        </div>
        
        <div class="input-group">
            <label>伤害减免 <span class="unit">%</span></label>
            <input type="number" id="damageReduction" placeholder="请输入伤害减免" step="0.1" min="0" max="100" value="0">
        </div>
        
        <div class="input-group">
            <label>每秒攻击次数 <span class="unit">次/秒</span></label>
            <input type="number" id="attackPerSecond" placeholder="请输入每秒攻击次数" step="0.1" min="0" value="1">
        </div>
        
        <div class="input-group">
            <label>需要击败时间 <span class="unit">秒</span></label>
            <input type="number" id="timeLimit" placeholder="请输入需要击败的时间" step="1" min="1" value="30">
        </div>
        
        <button class="btn-calculate" onclick="calculate()">计算</button>
        
        <div class="result" id="result">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-value" id="resultValue"></div>
            <div class="result-detail" id="resultDetail"></div>
            <div class="result-advice" id="resultAdvice"></div>
        </div>
    </div>
    
    <script>
        function calculate() {
            const attackPower = parseFloat(document.getElementById('attackPower').value) || 0;
            const critRate = parseFloat(document.getElementById('critRate').value) || 0;
            const monsterHpInput = parseFloat(document.getElementById('monsterHp').value) || 0;
            const monsterHp = monsterHpInput * 10000;
            const damageBonus = parseFloat(document.getElementById('damageBonus').value) || 0;
            const damageReduction = parseFloat(document.getElementById('damageReduction').value) || 0;
            const attackPerSecond = parseFloat(document.getElementById('attackPerSecond').value) || 1;
            const timeLimit = parseFloat(document.getElementById('timeLimit').value) || 30;
            
            if (attackPower <= 0 || monsterHpInput <= 0) {
                alert('请输入有效的战力和怪物血量！');
                return;
            }
            
            const critMultiplier = 1 + critRate / 100;
            const bonusMultiplier = 1 + damageBonus / 100;
            const reductionMultiplier = 1 - damageReduction / 100;
            
            const expectedDamagePerHit = attackPower * critMultiplier * bonusMultiplier * reductionMultiplier;
            const totalDamage = expectedDamagePerHit * attackPerSecond * timeLimit;
            const totalDamageInWan = totalDamage / 10000;
            
            const result = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultValue = document.getElementById('resultValue');
            const resultDetail = document.getElementById('resultDetail');
            const resultAdvice = document.getElementById('resultAdvice');
            
            result.style.display = 'block';
            
            if (totalDamage >= monsterHp) {
                result.className = 'result success';
                resultTitle.textContent = '🎉 可以击败！';
                resultValue.textContent = totalDamageInWan.toFixed(2) + ' 万';
                resultDetail.textContent = `在 ${timeLimit} 秒内可造成 ${totalDamageInWan.toFixed(2)} 万伤害，怪物血量 ${monsterHpInput} 万`;
                
                const surplus = totalDamage - monsterHp;
                const surplusInWan = surplus / 10000;
                const surplusPercent = ((surplus / monsterHp) * 100).toFixed(1);
                resultAdvice.textContent = `剩余伤害：${surplusInWan.toFixed(2)} 万（超出 ${surplusPercent}%）`;
            } else {
                result.className = 'result';
                resultTitle.textContent = '😢 无法击败';
                resultValue.textContent = totalDamageInWan.toFixed(2) + ' 万';
                resultDetail.textContent = `在 ${timeLimit} 秒内仅能造成 ${totalDamageInWan.toFixed(2)} 万伤害，怪物血量 ${monsterHpInput} 万`;
                
                const requiredPower = monsterHp / (critMultiplier * bonusMultiplier * reductionMultiplier * attackPerSecond * timeLimit);
                const increasePercent = (((requiredPower - attackPower) / attackPower) * 100).toFixed(1);
                
                resultAdvice.textContent = `需要战力：${requiredPower.toFixed(2)}（还需提升 ${increasePercent}%）`;
            }
            
            result.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
